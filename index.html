<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2420" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Culinary Arts">

<title>Culinary Arts · ASU–Newport</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@500,600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="shell">

  <header class="shellbar">
    <div class="shellbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2.5 0-4.5 1.6-5.1 4C4.2 7.2 2 9.6 2 12.5 2 15.5 4.4 18 7.4 18h9.2c3 0 5.4-2.5 5.4-5.5 0-2.9-2.2-5.3-4.9-5.5C16.5 4.6 14.5 3 12 3z"/><path d="M6.5 21h11"/></svg>
        </div>
        <div class="brand-text">
          <span class="eyebrow">ASU–Newport · Culinary Department</span>
          <h1>Culinary Arts</h1>
        </div>
      </div>
      <div class="shell-nav-actions">
        <a class="schedule-link" href="schedule.html">Weekly schedule <span aria-hidden="true">↗</span></a>
        <button class="admin-trigger-btn" id="openAdminBtn" title="Instructor Admin &amp; Canvas Importer">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Admin</span>
        </button>
      </div>

      <nav class="class-switch" id="classSwitch" role="tablist" aria-label="Choose a class">
        <button class="class-pill" role="tab" id="tab-culinary2" aria-selected="false" aria-controls="frame-culinary2" data-class="culinary2">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h14v4a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M17 13h4M7 4c0 1.5 1 1.5 1 3M11 4c0 1.5 1 1.5 1 3"/></svg>
          <span>Culinary 2</span>
        </button>
        <button class="class-pill" role="tab" id="tab-baking" aria-selected="false" aria-controls="frame-baking" data-class="baking">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.9A4 4 0 0 1 7.5 6a5 5 0 0 1 9 0A4 4 0 0 1 18 13.9V20H6z"/><path d="M6 17h12"/></svg>
          <span>Baking &amp; Pastry</span>
        </button>
        <button class="class-pill" role="tab" id="tab-bar" aria-selected="false" aria-controls="frame-bar" data-class="bar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16l-8 9z"/><path d="M12 13v7M8 20h8"/></svg>
          <span>Bar &amp; Beverage</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="frames" id="frames">
    <iframe class="frame" id="frame-culinary2" title="Culinary 2: Cooking Techniques" data-dir="culinary2/" tabindex="-1"></iframe>
    <iframe class="frame" id="frame-baking" title="Foundations of Baking & Pastry" data-dir="baking/" tabindex="-1"></iframe>
    <iframe class="frame" id="frame-bar" title="Bar and Beverage" data-dir="bar/" tabindex="-1"></iframe>
    <div class="frame-loading" id="frameLoading" aria-hidden="true">
      <div class="skel skel-hero"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line short"></div>
      <div class="skel skel-block"></div>
    </div>
  </div>

</div>
<script src="culinary2/data.js"></script>
<script src="baking/data.js"></script>
<script src="bar/data.js"></script>
<script src="schedule-data.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="admin.js"></script>
<script src="class-pages.js"></script>
<script src="app.js"></script>
</body>
</html>
